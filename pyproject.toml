[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rotation-key"
version = "0.1.0"
description = "Roteador round-robin de chaves de APIs de IA, leve o bastante para rodar no Termux"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "brunodavi" }]
dependencies = []

[project.scripts]
ai-rotation-key = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src", "src.utils"]
